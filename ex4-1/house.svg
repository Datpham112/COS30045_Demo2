<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-label="A house with a chimney, two windows, a path, a tree, a pond and a sun in a garden" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

    <!-- SKY: <rect> -->
    <rect x="0" y="0" width="800" height="330" fill="#bfe3f5"/>

    <!-- SUN: <circle> and rays as <line> -->
    <circle cx="690" cy="80" r="40" fill="#ffd54a" stroke="#f2a900" stroke-width="3"/>
    <g stroke="#f2a900" stroke-width="3" stroke-linecap="round">
      <line x1="690" y1="20"  x2="690" y2="30"/>
      <line x1="690" y1="130" x2="690" y2="140"/>
      <line x1="630" y1="80"  x2="640" y2="80"/>
      <line x1="740" y1="80"  x2="750" y2="80"/>
    </g>

    <!-- CLOUD: three <ellipse> elements -->
    <g fill="#ffffff" opacity="0.9">
      <ellipse cx="150" cy="70"  rx="50" ry="22"/>
      <ellipse cx="190" cy="60"  rx="40" ry="24"/>
      <ellipse cx="115" cy="62"  rx="32" ry="18"/>
    </g>

    <!-- DISTANT HILLS: <path> with curves (Q = quadratic Bézier) -->
    <path d="M 0 330 Q 150 240 300 330 T 600 330 T 800 300 L 800 330 Z" fill="#8fbf8f"/>

    <!-- GRASS: <rect> -->
    <rect x="0" y="330" width="800" height="170" fill="#6ab04c"/>

    <!-- PATH: <polygon> (a tapering path from the door to the bottom of the picture) -->
    <polygon points="305,410 345,410 380,500 270,500" fill="#d8c3a5" stroke="#a88f6b" stroke-width="2"/>

    <!-- CHIMNEY: <rect> (drawn before roof so the roof overlaps it) -->
    <rect x="410" y="175" width="35" height="70" fill="#a0522d" stroke="#5c2e12" stroke-width="2"/>
    <!-- smoke: <polyline> (open shape, no fill) -->
    <polyline points="427,170 420,150 435,135 422,115 437,98" fill="none" stroke="#888" stroke-width="4"
              stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 8"/>

    <!-- HOUSE BODY: <rect> -->
    <rect x="200" y="250" width="250" height="160" fill="#f4d6a0" stroke="#7a5b2e" stroke-width="3"/>

    <!-- ROOF: <polygon> (triangle) -->
    <polygon points="185,250 325,150 465,250" fill="#b03a2e" stroke="#6b1f17" stroke-width="3" stroke-linejoin="round"/>

    <!-- DOOR: <rect> with rounded corners + doorknob <circle> -->
    <rect x="305" y="320" width="40" height="90" rx="4" ry="4" fill="#6d4c2f" stroke="#3e2a18" stroke-width="2"/>
    <circle cx="337" cy="367" r="3.5" fill="#ffd54a"/>

    <!-- WINDOWS: one <g> so both share the same styling.
         The group is drawn once at the origin and <use> is avoided on purpose:
         instead each window is its own <g> with transform="translate(x, y)". -->
    <g id="windows" fill="#9ed8f0" stroke="#3b3b3b" stroke-width="3">
      <g id="window-left" transform="translate(220, 285)">
        <rect x="0" y="0" width="60" height="60"/>
        <line x1="30" y1="0"  x2="30" y2="60"/>
        <line x1="0"  y1="30" x2="60" y2="30"/>
      </g>
      <g id="window-right" transform="translate(370, 285)">
        <rect x="0" y="0" width="60" height="60"/>
        <line x1="30" y1="0"  x2="30" y2="60"/>
        <line x1="0"  y1="30" x2="60" y2="30"/>
      </g>
    </g>

    <!-- TREE: trunk <rect> + foliage <circle>s -->
    <rect x="590" y="300" width="26" height="110" fill="#6d4c2f"/>
    <g fill="#2e7d32" stroke="#1b5e20" stroke-width="2">
      <circle cx="603" cy="275" r="55"/>
      <circle cx="565" cy="305" r="36"/>
      <circle cx="642" cy="305" r="36"/>
    </g>
    <!-- apples -->
    <g fill="#d32f2f">
      <circle cx="585" cy="265" r="6"/>
      <circle cx="622" cy="285" r="6"/>
      <circle cx="600" cy="305" r="6"/>
    </g>

    <!-- POND: <ellipse> -->
    <ellipse cx="560" cy="450" rx="80" ry="28" fill="#4fc3f7" stroke="#0277bd" stroke-width="3"/>

    <!-- FENCE: repeated <rect> pickets + a rail <line> -->
    <g fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5">
      <rect x="20"  y="375" width="14" height="55"/>
      <rect x="45"  y="375" width="14" height="55"/>
      <rect x="70"  y="375" width="14" height="55"/>
      <rect x="95"  y="375" width="14" height="55"/>
      <rect x="120" y="375" width="14" height="55"/>
      <rect x="145" y="375" width="14" height="55"/>
    </g>
    <line x1="15" y1="392" x2="165" y2="392" stroke="#9e9e9e" stroke-width="4"/>
    <line x1="15" y1="415" x2="165" y2="415" stroke="#9e9e9e" stroke-width="4"/>

    <!-- FLOWERS: <circle> petals + stem <line> + <path> leaf -->
    <g>
      <line x1="230" y1="470" x2="230" y2="440" stroke="#2e7d32" stroke-width="3"/>
      <path d="M 230 458 Q 242 450 246 456 Q 238 464 230 458 Z" fill="#2e7d32"/>
      <circle cx="230" cy="436" r="8" fill="#e91e63"/>
      <circle cx="230" cy="436" r="3" fill="#ffeb3b"/>
    </g>
    <g>
      <line x1="265" y1="480" x2="265" y2="452" stroke="#2e7d32" stroke-width="3"/>
      <circle cx="265" cy="448" r="8" fill="#ab47bc"/>
      <circle cx="265" cy="448" r="3" fill="#ffeb3b"/>
    </g>

    <!-- CAPTION: <text> -->
    <text x="20" y="485" font-family="Georgia, serif" font-size="14" fill="#fff">My garden – Exercise 4.1</text>
  </svg>
